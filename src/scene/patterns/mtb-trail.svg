<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="204" viewBox="0 0 256 204">
  <defs>
    <!-- across-trail alpha ramp: 0.5 at edges, 1.0 in tread; x-only so v-seamless -->
    <linearGradient id="dirt" x1="0" x2="256" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a4128" stop-opacity="0.5"/>
      <stop offset="0.18" stop-color="#7a5a36" stop-opacity="0.72"/>
      <stop offset="0.32" stop-color="#9a7448" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#a47c4c" stop-opacity="1"/>
      <stop offset="0.68" stop-color="#9a7448" stop-opacity="0.95"/>
      <stop offset="0.82" stop-color="#7a5a36" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#5a4128" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="tread" x1="86" x2="170" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a6439" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#8f683c" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#b08856" stop-opacity="1"/>
      <stop offset="0.82" stop-color="#8f683c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8a6439" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="108" x2="148" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8d4a8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8d4a8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e8d4a8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <!-- knob: shadow (blurred umber) + body + highlight -->
    <g id="knob">
      <rect x="-5.5" y="-6.5" width="12" height="16" rx="4" fill="#3b2614" opacity="0.7" filter="url(#soft)"/>
      <rect x="-5" y="-7" width="10" height="14" rx="3.5" fill="#6b4a2a"/>
      <rect x="-4" y="-6" width="3.5" height="11" rx="1.5" fill="#c09a66" opacity="0.55"/>
    </g>
    <!-- one full period of content; reused at -204, 0, +204 for wrap -->
    <g id="period">
      <rect x="0" y="0" width="256" height="204" fill="url(#dirt)"/>
      <rect x="86" y="0" width="84" height="204" fill="url(#tread)"/>
      <!-- tread speckle -->
      <g fill="#4a3320" opacity="0.35">
        <circle cx="96" cy="14" r="1.2"/><circle cx="150" cy="40" r="1"/><circle cx="108" cy="77" r="1.3"/>
        <circle cx="160" cy="112" r="1.1"/><circle cx="92" cy="141" r="1"/><circle cx="134" cy="171" r="1.2"/>
        <circle cx="120" cy="196" r="1"/><circle cx="165" cy="8" r="1"/>
      </g>
      <!-- knob prints: 6 rows, 34 px apart, staggered; row 0 straddles v=0 -->
      <g>
        <use xlink:href="#knob" x="100" y="0"/><use xlink:href="#knob" x="128" y="0"/><use xlink:href="#knob" x="156" y="0"/>
        <use xlink:href="#knob" x="114" y="17"/><use xlink:href="#knob" x="142" y="17"/>
        <use xlink:href="#knob" x="100" y="34"/><use xlink:href="#knob" x="128" y="34"/><use xlink:href="#knob" x="156" y="34"/>
        <use xlink:href="#knob" x="114" y="51"/><use xlink:href="#knob" x="142" y="51"/>
        <use xlink:href="#knob" x="100" y="68"/><use xlink:href="#knob" x="128" y="68"/><use xlink:href="#knob" x="156" y="68"/>
        <use xlink:href="#knob" x="114" y="85"/><use xlink:href="#knob" x="142" y="85"/>
        <use xlink:href="#knob" x="100" y="102"/><use xlink:href="#knob" x="128" y="102"/><use xlink:href="#knob" x="156" y="102"/>
        <use xlink:href="#knob" x="114" y="119"/><use xlink:href="#knob" x="142" y="119"/>
        <use xlink:href="#knob" x="100" y="136"/><use xlink:href="#knob" x="128" y="136"/><use xlink:href="#knob" x="156" y="136"/>
        <use xlink:href="#knob" x="114" y="153"/><use xlink:href="#knob" x="142" y="153"/>
        <use xlink:href="#knob" x="100" y="170"/><use xlink:href="#knob" x="128" y="170"/><use xlink:href="#knob" x="156" y="170"/>
        <use xlink:href="#knob" x="114" y="187"/><use xlink:href="#knob" x="142" y="187"/>
      </g>
      <rect x="108" y="0" width="40" height="204" fill="url(#sheen)"/>
      <!-- leaf litter (left and right verges) -->
      <g opacity="0.8">
        <ellipse cx="14" cy="22" rx="9" ry="4" transform="rotate(25 14 22)" fill="#a8672c"/>
        <ellipse cx="40" cy="60" rx="8" ry="3.5" transform="rotate(-30 40 60)" fill="#7e4a22"/>
        <ellipse cx="22" cy="100" rx="10" ry="4" transform="rotate(60 22 100)" fill="#c08a3c"/>
        <ellipse cx="58" cy="135" rx="7" ry="3" transform="rotate(10 58 135)" fill="#8c5a28"/>
        <ellipse cx="12" cy="172" rx="9" ry="4" transform="rotate(-50 12 172)" fill="#9a6a30"/>
        <ellipse cx="46" cy="201" rx="8" ry="3.5" transform="rotate(35 46 201)" fill="#b07a34"/>
        <ellipse cx="236" cy="12" rx="9" ry="4" transform="rotate(-20 236 12)" fill="#8c5a28"/>
        <ellipse cx="206" cy="48" rx="8" ry="3.5" transform="rotate(45 206 48)" fill="#b88a40"/>
        <ellipse cx="242" cy="88" rx="10" ry="4" transform="rotate(-65 242 88)" fill="#a8672c"/>
        <ellipse cx="214" cy="126" rx="7" ry="3" transform="rotate(15 214 126)" fill="#7e4a22"/>
        <ellipse cx="238" cy="160" rx="9" ry="4" transform="rotate(30 238 160)" fill="#c08a3c"/>
        <ellipse cx="200" cy="190" rx="8" ry="3.5" transform="rotate(-40 200 190)" fill="#9a6a30"/>
      </g>
      <!-- roots -->
      <g fill="none" stroke-linecap="round" opacity="0.8">
        <path d="M0 76 C 20 70 42 82 70 74" stroke="#4a3018" stroke-width="5"/>
        <path d="M0 74 C 20 68 42 80 70 72" stroke="#7a5430" stroke-width="1.6"/>
        <path d="M256 150 C 236 156 214 144 188 152" stroke="#4a3018" stroke-width="5"/>
        <path d="M256 148 C 236 154 214 142 188 150" stroke="#7a5430" stroke-width="1.6"/>
        <path d="M230 196 C 222 204 220 208 214 214" stroke="#4a3018" stroke-width="4"/>
      </g>
    </g>
  </defs>
  <use xlink:href="#period" y="-204"/>
  <use xlink:href="#period" y="0"/>
  <use xlink:href="#period" y="204"/>
</svg>
