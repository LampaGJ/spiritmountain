<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="204" viewBox="0 0 256 204">
  <defs>
    <!-- across-trail alpha ramp: 0.5 at edges, 1.0 in lane; x-only so v-seamless -->
    <linearGradient id="snow" x1="0" x2="256" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C3D2E6" stop-opacity="0.5"/>
      <stop offset="0.16" stop-color="#DCE7F4" stop-opacity="0.72"/>
      <stop offset="0.3" stop-color="#EBF2FA" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#F1F6FC" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#EBF2FA" stop-opacity="0.95"/>
      <stop offset="0.84" stop-color="#DCE7F4" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#C3D2E6" stop-opacity="0.5"/>
    </linearGradient>
    <!-- groomer fine grain: pattern period 4 px in x, full height in y -->
    <linearGradient id="grain" x1="0" x2="4" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9FB3CE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9FB3CE" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#9FB3CE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="groom" patternUnits="userSpaceOnUse" x="0" y="0" width="4" height="204">
      <rect width="4" height="204" fill="url(#grain)"/>
    </pattern>
    <!-- lane mask: fade grooming toward verges -->
    <linearGradient id="lanefade" x1="0" x2="256" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.12" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="soft2" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="0.9"/></filter>
    <!-- stitched turbulence: tiles seamlessly at the filter region size 256x204 -->
    <filter id="noise" x="0" y="0" width="256" height="204" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.70  0 0 0 0 0.82  0 0 0 -1.9 1.05"/>
    </filter>
    <!-- knob impression: a cup, shadowed on the upper (lit-from-top-left) wall, pale lip below-right -->
    <g id="cup">
      <rect x="-4.2" y="-2.6" width="9" height="7" rx="2" fill="#F8FBFF" opacity="0.8" filter="url(#soft2)"/>
      <rect x="-4.5" y="-4.4" width="8.6" height="7.6" rx="2" fill="#7F93B2" opacity="0.85" filter="url(#soft)"/>
      <rect x="-3.4" y="-3.1" width="6.6" height="5.4" rx="1.6" fill="#8CA0BE" opacity="0.9"/>
      <rect x="-2.6" y="-0.2" width="5.4" height="2.4" rx="1.1" fill="#C9D6E8" opacity="0.8"/>
    </g>
    <g id="period">
      <rect width="256" height="204" fill="url(#snow)"/>
