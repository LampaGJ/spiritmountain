<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="85" viewBox="0 0 256 85">
  <defs>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="256" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="0.05" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.95" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <mask id="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="85">
      <rect width="256" height="85" fill="url(#edge)"/>
    </mask>
    <!-- chute floor: bluer and glossier than berms, brighter toward the lit right -->
    <linearGradient id="chute" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#bfd3ea"/>
      <stop offset="0.12" stop-color="#d3e3f5"/>
      <stop offset="0.5" stop-color="#dcebfa"/>
      <stop offset="0.88" stop-color="#d0e1f4"/>
      <stop offset="1" stop-color="#c6daf0"/>
    </linearGradient>
    <!-- centre polish streak -->
    <linearGradient id="polish" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- berm cross-section: shadowed left flank, lit crest right of centre, soft right flank -->
    <linearGradient id="berm" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9fb3cd"/>
      <stop offset="0.22" stop-color="#c3d2e5"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#f1f6fc"/>
      <stop offset="1" stop-color="#d6e2f1"/>
    </linearGradient>
    <linearGradient id="bermedgeL" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e6eef8"/>
      <stop offset="1" stop-color="#f6f9fd"/>
    </linearGradient>
    <!-- tube pressure mark centred on 0,0 -->
    <radialGradient id="dent" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9cfe8" stop-opacity="0.25"/>
      <stop offset="0.75" stop-color="#a9c0dc" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#97b0d0" stop-opacity="0.55"/>
    </radialGradient>
    <g id="mark">
      <ellipse rx="12" ry="11" fill="url(#dent)"/>
      <ellipse rx="12" ry="11" fill="none" stroke="#7e98ba" stroke-width="1.2" stroke-opacity="0.5"/>
      <path d="M-8.5 8 A12 11 0 0 0 9 -7.5" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.8" stroke-linecap="round" transform="translate(1 1)"/>
      <ellipse rx="5" ry="4.5" fill="none" stroke="#8aa3c4" stroke-width="0.8" stroke-opacity="0.35"/>
    </g>
    <!-- one chute: 48 wide, centre at local x=24 -->
    <g id="lane">
      <rect width="48" height="85" fill="url(#chute)"/>
      <rect x="18" width="12" height="85" fill="url(#polish)"/>
      <rect x="23.2" width="1.6" height="85" fill="#ffffff" opacity="0.55"/>
      <rect x="4" width="0.8" height="85" fill="#aac2de" opacity="0.5"/>
    </g>
  </defs>
  <g mask="url(#alpha)">
    <rect width="256" height="85" fill="#eef4fb"/>
    <!-- berms: full height, vary in x only -->
    <rect x="0" width="8" height="85" fill="url(#bermedgeL)"/>
    <rect x="56" width="16" height="85" fill="url(#berm)"/>
    <rect x="120" width="16" height="85" fill="url(#berm)"/>
    <rect x="184" width="16" height="85" fill="url(#berm)"/>
    <rect x="248" width="8" height="85" fill="url(#bermedgeL)"/>
    <!-- berm cast shadow onto the left edge of each chute -->
    <g fill="#8ea6c4" opacity="0.35">
      <rect x="8" width="2.5" height="85"/><rect x="72" width="2.5" height="85"/>
      <rect x="136" width="2.5" height="85"/><rect x="200" width="2.5" height="85"/>
    </g>
    <use xlink:href="#lane" x="8"/>
    <use xlink:href="#lane" x="72"/>
    <use xlink:href="#lane" x="136"/>
    <use xlink:href="#lane" x="200"/>
    <!-- pressure marks: two per lane per period (42.5 px), each instanced at y-85, y, y+85 -->
    <g id="marks">
      <use xlink:href="#mark" x="32" y="12"/><use xlink:href="#mark" x="33" y="54.5"/>
      <use xlink:href="#mark" x="96" y="33"/><use xlink:href="#mark" x="95" y="75.5"/>
      <use xlink:href="#mark" x="160" y="21"/><use xlink:href="#mark" x="161" y="63.5"/>
      <use xlink:href="#mark" x="224" y="42"/><use xlink:href="#mark" x="223" y="84.5"/>
    </g>
    <use xlink:href="#marks" y="-85"/>
    <use xlink:href="#marks" y="85"/>
  </g>
</svg>
