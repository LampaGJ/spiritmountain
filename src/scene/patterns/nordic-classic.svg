<svg xmlns="http://www.w3.org/2000/svg" width="256" height="128" viewBox="0 0 256 128">
  <defs>
    <!-- horizontal-only alpha ramp: 0.6 at edges, 1.0 inside; invariant in v -->
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="256" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="0.09" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.91" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <mask id="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="128">
      <rect width="256" height="128" fill="url(#edge)"/>
    </mask>
    <!-- groomer corduroy: 16x64 cell, period divides 128 -->
    <pattern id="groom" patternUnits="userSpaceOnUse" width="16" height="64">
      <rect width="16" height="64" fill="#eef4fb"/>
      <rect x="2" width="1.5" height="64" fill="#dce7f4" opacity="0.55"/>
      <rect x="7" width="1" height="64" fill="#ffffff" opacity="0.7"/>
      <rect x="11" width="2" height="64" fill="#d3e0f0" opacity="0.4"/>
      <rect x="4" y="9" width="3" height="1" fill="#d3e0f0" opacity="0.5"/>
      <rect x="12" y="27" width="3" height="1" fill="#ffffff" opacity="0.6"/>
      <rect x="1" y="44" width="4" height="1" fill="#d3e0f0" opacity="0.45"/>
      <rect x="9" y="58" width="3" height="1" fill="#ffffff" opacity="0.6"/>
    </pattern>
    <!-- groove interior: left wall in shadow, floor lighter to the right -->
    <linearGradient id="gv" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6f84a0"/>
      <stop offset="0.45" stop-color="#8396b0"/>
      <stop offset="1" stop-color="#a9b9cd"/>
    </linearGradient>
  </defs>
  <g mask="url(#alpha)">
    <rect width="256" height="128" fill="#eef4fb"/>
    <rect width="256" height="128" fill="url(#groom)"/>
    <!-- groove 1 centre x=32, groove 2 centre x=44.8 (12.8 px = 20 cm), width 4.5 px = 7 cm -->
    <g>
      <rect x="27.5" width="1.6" height="128" fill="#b8c7da" opacity="0.7"/>
      <rect x="34.9" width="1.6" height="128" fill="#ffffff"/>
      <rect x="29.75" width="4.5" height="128" fill="url(#gv)"/>
      <rect x="29.75" width="1.1" height="128" fill="#5d7190"/>
      <rect x="40.3" width="1.6" height="128" fill="#b8c7da" opacity="0.7"/>
      <rect x="47.7" width="1.6" height="128" fill="#ffffff"/>
      <rect x="42.55" width="4.5" height="128" fill="url(#gv)"/>
      <rect x="42.55" width="1.1" height="128" fill="#5d7190"/>
    </g>
    <!-- pole plants: one pair per 2 m, wholly inside the tile (y 56..72) -->
    <g fill="#9fb2c9" opacity="0.55">
      <ellipse cx="22" cy="60" rx="1.6" ry="1.2"/>
      <ellipse cx="55" cy="68" rx="1.6" ry="1.2"/>
    </g>
    <g fill="#ffffff" opacity="0.7">
      <ellipse cx="22.6" cy="59.4" rx="0.8" ry="0.5"/>
      <ellipse cx="55.6" cy="67.4" rx="0.8" ry="0.5"/>
    </g>
  </g>
</svg>
