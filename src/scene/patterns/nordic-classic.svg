<svg xmlns="http://www.w3.org/2000/svg" width="256" height="128" viewBox="0 0 256 128">
  <defs>
    <!-- x-only gradients (invariant along the trail) give the flat colours a smooth tonal range -->
    <linearGradient id="snow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="256" y2="0">
      <stop offset="0" stop-color="#eaf1fa"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf1fa"/>
    </linearGradient>
    <linearGradient id="groove" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14307a"/>
      <stop offset="1" stop-color="#2447a0"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="256" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="0.04" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.96" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <mask id="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="128">
      <rect width="256" height="128" fill="url(#edge)"/>
    </mask>
  </defs>
  <!-- bold map symbol: two dark-blue track grooves centred on the tile, one cross-tick per 2 m period -->
  <g mask="url(#alpha)">
    <rect width="256" height="128" fill="url(#snow)"/>
    <rect x="66" y="0" width="44" height="128" fill="url(#groove)"/>
    <rect x="146" y="0" width="44" height="128" fill="url(#groove)"/>
    <rect x="110" y="52" width="36" height="24" fill="#1b3a8c"/>
  </g>
</svg>
