<svg xmlns="http://www.w3.org/2000/svg" width="256" height="32" viewBox="0 0 256 32">
  <defs>
    <linearGradient id="ridge" x1="0" y1="0" x2="8" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9CBE3"/>
      <stop offset="0.22" stop-color="#C9D8EB"/>
      <stop offset="0.5" stop-color="#EAF1F9"/>
      <stop offset="0.78" stop-color="#C9D8EB"/>
      <stop offset="1" stop-color="#B9CBE3"/>
    </linearGradient>
    <pattern id="corduroy" patternUnits="userSpaceOnUse" x="0" y="0" width="8" height="32">
      <rect x="0" y="0" width="8" height="32" fill="url(#ridge)"/>
    </pattern>
    <linearGradient id="sheen" x1="0" y1="0" x2="256" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0F5FB" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F0F5FB" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F0F5FB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="256" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#999999"/>
      <stop offset="0.18" stop-color="#F2F2F2"/>
      <stop offset="0.82" stop-color="#F2F2F2"/>
      <stop offset="1" stop-color="#999999"/>
    </linearGradient>
    <mask id="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="32">
      <rect x="0" y="0" width="256" height="32" fill="url(#edge)"/>
    </mask>
  </defs>
  <g mask="url(#alpha)">
    <rect x="0" y="0" width="256" height="32" fill="url(#corduroy)"/>
    <rect x="0" y="0" width="256" height="32" fill="url(#sheen)"/>
  </g>
</svg>
