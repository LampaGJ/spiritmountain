<svg xmlns="http://www.w3.org/2000/svg" width="256" height="85" viewBox="0 0 256 85">
  <defs>
    <linearGradient id="snow" x1="0" x2="256" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e4edf6" stop-opacity="0.7"/>
      <stop offset="0.08" stop-color="#eef4fa" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#fbfdff" stop-opacity="1"/>
      <stop offset="0.92" stop-color="#eef4fa" stop-opacity="1"/>
      <stop offset="1" stop-color="#e4edf6" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="teal" x1="16" x2="240" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a4f5a"/>
      <stop offset="0.5" stop-color="#0e6470"/>
      <stop offset="1" stop-color="#0a4f5a"/>
    </linearGradient>
  </defs>
  <rect width="256" height="85" fill="url(#snow)"/>
  <!-- wide double bar across the run, deep teal -->
