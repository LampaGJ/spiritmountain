<svg xmlns="http://www.w3.org/2000/svg" width="256" height="192" viewBox="0 0 256 192">
  <defs>
    <!-- low-amplitude tint noise on the snow only; whole cycles per tile (6 along v) so it stitches -->
    <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="192" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03125 0.0416667" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.74  0 0 0 0 0.90  0 0 0 -1.6 1.0"/>
    </filter>
  </defs>
  <rect width="256" height="192" fill="#ffffff"/>
  <rect width="256" height="192" filter="url(#grain)" opacity="0.5"/>
  <!-- one bold herringbone V (apex up), wholly inside the tile -->
  <polyline points="34,152 128,40 222,152" fill="none" stroke="#12327f" stroke-width="44" stroke-linejoin="miter" stroke-miterlimit="4" stroke-linecap="butt"/>
</svg>
