<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="192" viewBox="0 0 256 192">
  <defs>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="256" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <mask id="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="192">
      <rect width="256" height="192" fill="url(#edge)"/>
    </mask>
    <linearGradient id="snow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="256" y2="0">
      <stop offset="0" stop-color="#e6eef8"/>
      <stop offset="0.5" stop-color="#f4f8fd"/>
      <stop offset="1" stop-color="#e6eef8"/>
    </linearGradient>
    <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="192">
      <feTurbulence type="fractalNoise" baseFrequency="0.03125 0.0416667" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.56  0 0 0 0 0.70  0 0 0 -1.1 0.62"/>
    </filter>
    <!-- one period = 96 px (1.5 m); left cut at phase 0, right cut at phase 48 (half period) -->
    <g id="cuts" stroke-linecap="round" fill="none">
      <!-- left diagonal: outer-left rises toward centre -->
      <path d="M26 36 L118 8" stroke="#8da0b6" stroke-opacity="0.18" stroke-width="13"/>
      <path d="M26 36 L118 8" stroke="#7f93a8" stroke-opacity="0.50" stroke-width="7"/>
      <path d="M26 36 L118 8" stroke="#6f84a0" stroke-opacity="0.45" stroke-width="3"/>
      <path d="M26 41 L118 13" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5"/>
      <!-- right diagonal, mirrored, offset +48 -->
      <path d="M230 84 L138 56" stroke="#8da0b6" stroke-opacity="0.18" stroke-width="13"/>
      <path d="M230 84 L138 56" stroke="#7f93a8" stroke-opacity="0.50" stroke-width="7"/>
      <path d="M230 84 L138 56" stroke="#6f84a0" stroke-opacity="0.45" stroke-width="3"/>
      <path d="M230 89 L138 61" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5"/>
    </g>
    <g id="corduroy" stroke="#9fb3cb" stroke-opacity="0.16" stroke-width="2">
      <path d="M20 0V192M44 0V192M68 0V192M92 0V192M116 0V192M140 0V192M164 0V192M188 0V192M212 0V192M236 0V192"/>
    </g>
  </defs>
  <g mask="url(#alpha)">
    <rect width="256" height="192" fill="url(#snow)"/>
    <rect width="256" height="192" filter="url(#grain)" opacity="0.35"/>
    <use xlink:href="#corduroy"/>
    <use xlink:href="#cuts" y="-96"/>
    <use xlink:href="#cuts" y="0"/>
    <use xlink:href="#cuts" y="96"/>
    <use xlink:href="#cuts" y="192"/>
  </g>
</svg>
