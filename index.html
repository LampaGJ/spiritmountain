<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Spirit Mountain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    />
    <style>
      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #attribution {
        position: fixed;
        right: 8px;
        bottom: 6px;
        z-index: 5;
        font:
          11px/1.3 system-ui,
          sans-serif;
        color: rgba(255, 255, 255, 0.85);
        text-shadow: var(--sm-halo, 0 0 3px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.7));
      }
      /* Phone: sit above the bottom control bar (--sm-bar-h comes from rail.css) instead of under its keys. */
      @media (max-width: 719px) {
        #attribution {
          left: 8px;
          right: 8px;
          bottom: calc(var(--sm-bar-h, 0px) + 4px);
          font-size: 10px;
          line-height: 1.25;
        }
      }
      #attribution a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <aside id="annotation-panel" class="sm-plate" hidden></aside>
    <div id="pick-tooltip" class="sm-plate" role="tooltip" hidden></div>
    <footer id="attribution">
      <a href="https://www.openstreetmap.org/copyright"
        >Map data © OpenStreetMap contributors (ODbL)</a
      >
      · Imagery and elevation: USGS 3DEP and NAIP (public domain) · Sky: Poly Haven (CC0)
    </footer>
  </body>
</html>
